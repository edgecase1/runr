name: CI
on:
  push:
  pull_request:

jobs:
  trivy-test:
    runs-on: ubuntu-latest
    steps:
      - name: install dependencies
        run: |
          sudo apt-get update -y && sudo apt-get install gcc libcap-dev

      - name: Checkout
        uses: actions/checkout@v4

      - name: compiling
        run: |
          pushd src
          make
          popd 
      
      - name: Archive code coverage results
        uses: actions/upload-artifact@v4
        with:
          name: runr 
          path: src/runr-static

